name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_triage_desk
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run database migrations on CI test database
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_triage_desk
        run: |
          python scripts/migrate.py --database-url "$DATABASE_URL"

      - name: Run complete test suite
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_triage_desk
          TEST_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_triage_desk
          JWT_SECRET: ci_throwaway_secret_minimum_32_chars_long_123456
          JWT_EXPIRE_MINUTES: 60
        run: |
          pytest -v

